services:
  james-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: james_digital_twin
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - JAMES_DATA_DIR=/app/data
      - JAMES_AUTH_ENABLED=false # Set to true to enforce login credentials
      - JAMES_AUTH_SECRET=james-prod-secret-change-in-gcp
      - RELOAD=false
    volumes:
      # Externalize SQLite databases & JSONL models to host directory
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/catalog"]
      interval: 30s
      timeout: 10s
      retries: 3
