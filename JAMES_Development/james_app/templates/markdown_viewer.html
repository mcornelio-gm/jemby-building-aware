<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or filename }} — Build Aware Documentation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Early Theme Sync Script (FOUC Prevention) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('james-theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS & Typography -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Marked.js for GitHub Flavored Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>

  <!-- KaTeX for Math Equations (Voltage Drop, Power Formulas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Mermaid.js for Architecture, Flowchart & Sequence Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    html, body {
      height: 100vh !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    html.dark, html.dark body {
      background-color: #0f172a;
      color: #f1f5f9;
    }
    html:not(.dark), html:not(.dark) body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b1220; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    html:not(.dark) ::-webkit-scrollbar-track { background: #f1f5f9; }
    html:not(.dark) ::-webkit-scrollbar-thumb { background: #cbd5e1; }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    #contentScrollArea {
      scroll-padding-top: 3rem;
    }

    /* Light Theme Structure Overrides */
    html:not(.dark) .bg-slate-900 {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-950\/60,
    html:not(.dark) .bg-slate-950 {
      background-color: #f1f5f9 !important;
    }
    html:not(.dark) .bg-slate-900\/90 {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-800 {
      background-color: #e2e8f0 !important;
      color: #1e293b !important;
      border-color: #cbd5e1 !important;
    }
    html:not(.dark) .hover\:bg-slate-700:hover {
      background-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200 {
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-300,
    html:not(.dark) .text-slate-400 {
      color: #475569 !important;
    }
    html:not(.dark) .border-slate-800,
    html:not(.dark) .border-slate-700 {
      border-color: #e2e8f0 !important;
    }

    /* Inline Code Formatting */
    .markdown-body :not(pre) > code {
      font-size: 0.875em !important;
      font-weight: 600 !important;
      padding: 0.15em 0.4em !important;
      border-radius: 4px !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }
    html.dark .markdown-body :not(pre) > code {
      background-color: #1e293b !important;
      color: #fbbf24 !important;
      border: 1px solid #334155 !important;
    }
    html:not(.dark) .markdown-body :not(pre) > code {
      background-color: #f1f5f9 !important;
      color: #b45309 !important;
      border: 1px solid #e2e8f0 !important;
    }

    /* Code Blocks (<pre><code>) */
    .markdown-body pre {
      padding: 1.25rem 1.5rem !important;
      border-radius: 10px !important;
      overflow-x: auto !important;
      font-size: 0.875rem !important;
      line-height: 1.7 !important;
      margin: 1.5rem 0 !important;
    }
    .markdown-body pre code {
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
      white-space: pre !important;
      word-break: normal !important;
      box-shadow: none !important;
    }
    html.dark .markdown-body pre {
      background-color: #0d1117 !important;
      border: 1px solid #30363d !important;
      color: #e6edf3 !important;
    }
    html:not(.dark) .markdown-body pre {
      background-color: #f6f8fa !important;
      border: 1px solid #d0d7de !important;
      color: #1f2328 !important;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    html.dark .markdown-body table th {
      background-color: #1e293b;
      color: #f8fafc;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border: 1px solid #334155;
    }
    html.dark .markdown-body table td {
      padding: 0.65rem 1rem;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    html.dark .markdown-body table tr:nth-child(even) {
      background-color: #111827;
    }
    html:not(.dark) .markdown-body table th {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
      border: 1px solid #cbd5e1 !important;
      font-weight: 600;
      padding: 0.75rem 1rem;
    }
    html:not(.dark) .markdown-body table td {
      border: 1px solid #e2e8f0 !important;
      color: #334155 !important;
      padding: 0.65rem 1rem;
    }
    html:not(.dark) .markdown-body table tr:nth-child(even) {
      background-color: #f8fafc !important;
    }

    /* Blockquotes */
    .markdown-body blockquote {
      border-left: 4px solid #6366f1;
      padding-left: 1rem;
      color: #94a3b8;
      font-style: italic;
    }
    html:not(.dark) .markdown-body blockquote {
      border-left: 4px solid #4f46e5;
      color: #64748b;
    }

    @media print {
      @page {
        margin: 1.5cm 1.5cm 1.5cm 1.5cm;
        size: portrait;
      }
      html, body {
        height: auto !important;
        min-height: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #0f172a !important;
        position: static !important;
        display: block !important;
      }
      header, aside, #sidebarToc, .no-print {
        display: none !important;
      }
      div.flex-1.flex.overflow-hidden,
      div.flex-1,
      div.flex {
        display: block !important;
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
        position: static !important;
      }
      main, #contentScrollArea {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        position: static !important;
      }
      #contentScrollArea > div {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        max-width: 100% !important;
        background: transparent !important;
        margin: 0 !important;
      }
      .markdown-body {
        color: #0f172a !important;
        max-width: 100% !important;
        font-size: 11pt !important;
        line-height: 1.6 !important;
      }
      .markdown-body h1 {
        font-size: 18pt !important;
        color: #0f172a !important;
        break-after: avoid;
        page-break-after: avoid;
        margin-top: 1rem !important;
        margin-bottom: 0.75rem !important;
      }
      .markdown-body h2 {
        font-size: 14pt !important;
        color: #0f172a !important;
        break-after: avoid;
        page-break-after: avoid;
        margin-top: 1.25rem !important;
        margin-bottom: 0.5rem !important;
      }
      .markdown-body h3, .markdown-body h4 {
        font-size: 12pt !important;
        color: #0f172a !important;
        break-after: avoid;
        page-break-after: avoid;
      }
      .markdown-body p, .markdown-body li {
        color: #334155 !important;
        orphans: 3;
        widows: 3;
      }
      .markdown-body pre,
      .markdown-body table,
      .markdown-body blockquote {
        break-inside: avoid;
        page-break-inside: avoid;
        margin: 1rem 0 !important;
      }
      .markdown-body pre {
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
        white-space: pre-wrap !important;
        word-break: break-word !important;
        font-size: 9pt !important;
        line-height: 1.5 !important;
      }
      .markdown-body table th {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
      }
      .markdown-body table td {
        border: 1px solid #cbd5e1 !important;
        color: #334155 !important;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden select-none">

  <!-- Top Navigation / Control Toolbar -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20 shrink-0 shadow-md">
    <!-- Left: Branding & Document Title -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="flex items-center gap-2 bg-indigo-950/80 dark:bg-indigo-950/80 light:bg-indigo-50 border border-indigo-800/60 light:border-indigo-200 px-2.5 py-1 rounded-lg">
        <span class="text-sm">⚡</span>
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-300 dark:text-indigo-300 light:text-indigo-700">BUILD AWARE DOCS</span>
      </div>
      <div class="h-4 w-px bg-slate-700"></div>
      <div class="min-w-0 flex items-center gap-2">
        <span class="text-xs px-2 py-0.5 rounded bg-emerald-950 dark:bg-emerald-950 light:bg-emerald-100 text-emerald-300 dark:text-emerald-300 light:text-emerald-800 border border-emerald-800/60 light:border-emerald-300 font-semibold font-mono uppercase">{{ doc_type }}</span>
        <h1 class="text-sm font-semibold text-slate-100 truncate" id="docTitle">{{ title or filename }}</h1>
      </div>
    </div>

    <!-- Center: Search in Document -->
    <div class="hidden md:flex items-center gap-2">
      <div class="relative">
        <input 
          type="text" 
          id="docSearchInput" 
          placeholder="Search in document (Ctrl+F)..." 
          class="w-64 px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 rounded-lg text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition"
        >
        <span id="searchMatchCount" class="absolute right-2 top-1.5 text-[10px] text-slate-400"></span>
      </div>
    </div>

    <!-- Right: Actions, Theme Toggle & Tools -->
    <div class="flex items-center gap-2">
      <!-- Dark / Light Theme Toggle -->
      <button 
        onclick="toggleDocTheme()" 
        id="themeToggleBtn"
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer"
        title="Toggle Light / Dark Mode"
      >
        <span id="themeIcon">🌙</span>
        <span id="themeLabel" class="hidden sm:inline">Dark</span>
      </button>

      <button 
        onclick="window.print()" 
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer"
        title="Print Document to PDF"
      >
        <span>🖨️</span>
        <span class="hidden sm:inline">Print / PDF</span>
      </button>

      <button 
        onclick="copyRawMarkdown()" 
        id="copyBtn"
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer"
        title="Copy Raw Markdown"
      >
        <span>📋</span>
        <span class="hidden sm:inline">Copy MD</span>
      </button>

      <a 
        href="/api/kb/view/{{ filename }}?raw=1" 
        download="{{ filename }}" 
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs font-semibold cursor-pointer" 
        title="Download Original File"
      >
        <span>💾</span>
        <span class="hidden sm:inline">Download</span>
      </a>

      <div class="h-4 w-px bg-slate-700 mx-1"></div>

      <button 
        onclick="window.close()" 
        class="p-1.5 rounded-lg bg-slate-800 hover:bg-rose-900/60 hover:text-rose-200 text-slate-400 transition text-xs cursor-pointer"
        title="Close Tab"
      >
        ✕
      </button>
    </div>
  </header>

  <!-- Main Body: Sidebar TOC + Formatted Content -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar: Table of Contents -->
    <aside id="sidebarToc" class="w-72 bg-slate-900/90 border-r border-slate-800 flex flex-col shrink-0 overflow-hidden transition-all duration-200">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <span>📑</span> Table of Contents
        </span>
        <span id="headingCount" class="text-[11px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">0</span>
      </div>
      <nav id="tocContainer" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs">
        <!-- Generated Dynamically -->
      </nav>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 overflow-y-auto py-8 px-4 md:px-10 lg:px-12 flex justify-center items-start bg-slate-950/60 scroll-smooth" id="contentScrollArea">
      <div class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-xl p-8 md:p-12 shadow-2xl mb-16">
        <!-- Breadcrumbs / Meta Tag -->
        <div class="flex items-center gap-2 text-xs text-slate-400 mb-6 pb-4 border-b border-slate-800">
          <span class="text-indigo-400 font-semibold">Knowledge Base</span>
          <span>/</span>
          <span>{{ category or 'Documentation' }}</span>
          <span>/</span>
          <span class="text-slate-200 font-mono">{{ filename }}</span>
        </div>

        <!-- Rendered Markdown Body -->
        <article 
          id="markdownRenderBody" 
          class="markdown-body prose prose-slate dark:prose-invert max-w-none"
        >
          <!-- Markdown Content Rendered by JS -->
        </article>
      </div>
    </main>
  </div>

  <script>
    const rawContent = {{ raw_content | tojson }};
    const targetSection = {{ section | tojson if section else "''" }};

    // 1. Theme Management
    function applyDocTheme(isDark) {
      const darkCss = document.getElementById('hljs-dark');
      const lightCss = document.getElementById('hljs-light');

      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
        document.getElementById('themeIcon').textContent = '🌙';
        document.getElementById('themeLabel').textContent = 'Dark';
        if (darkCss) darkCss.disabled = false;
        if (lightCss) lightCss.disabled = true;
        localStorage.setItem('james-theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
        document.getElementById('themeIcon').textContent = '☀️';
        document.getElementById('themeLabel').textContent = 'Light';
        if (darkCss) darkCss.disabled = true;
        if (lightCss) lightCss.disabled = false;
        localStorage.setItem('james-theme', 'light');
      }
      renderMermaidDiagrams(isDark);
    }

    function toggleDocTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyDocTheme(!isDark);
    }

    // 2. Configure marked with Mermaid Renderer
    const customRenderer = new marked.Renderer();
    const origCodeRenderer = customRenderer.code.bind(customRenderer);
    customRenderer.code = function(code, language) {
      if (language === 'mermaid') {
        const encoded = encodeURIComponent(code);
        return `<div class="mermaid-container my-6 p-4 rounded-xl bg-slate-950/40 dark:bg-slate-950/40 border border-slate-800 dark:border-slate-800 flex justify-center overflow-x-auto"><pre class="mermaid !bg-transparent !p-0 !border-0 text-center" data-mermaid-code="${encoded}">${code}</pre></div>`;
      }
      return origCodeRenderer(code, language);
    };

    marked.setOptions({
      gfm: true,
      breaks: true,
      renderer: customRenderer,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (e) {}
        }
        return hljs.highlightAuto(code).value;
      }
    });

    // 3. Render Markdown
    const renderContainer = document.getElementById('markdownRenderBody');
    renderContainer.innerHTML = marked.parse(rawContent);

    // 4. Render Math Equations (KaTeX)
    try {
      renderMathInElement(renderContainer, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    } catch(e) {
      console.warn('Math rendering skipped:', e);
    }

    // 5. Render Mermaid Diagrams
    function renderMermaidDiagrams(isDark) {
      if (typeof mermaid === 'undefined') return;
      const mermaidNodes = document.querySelectorAll('.mermaid');
      if (!mermaidNodes || mermaidNodes.length === 0) return;

      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        themeVariables: isDark ? {
          darkMode: true,
          background: '#0b1220',
          primaryColor: '#4f46e5',
          primaryTextColor: '#f8fafc',
          primaryBorderColor: '#818cf8',
          lineColor: '#94a3b8',
          secondaryColor: '#1e293b',
          tertiaryColor: '#0f172a'
        } : {
          darkMode: false,
          background: '#ffffff',
          primaryColor: '#e0e7ff',
          primaryTextColor: '#1e293b',
          primaryBorderColor: '#6366f1',
          lineColor: '#64748b'
        }
      });

      mermaidNodes.forEach(el => {
        if (el.dataset.mermaidCode) {
          el.removeAttribute('data-processed');
          el.innerHTML = decodeURIComponent(el.dataset.mermaidCode);
        }
      });

      try {
        mermaid.run({
          querySelector: '.mermaid'
        });
      } catch (e) {
        console.warn('Mermaid render error:', e);
      }
    }

    // Initialize theme state and render mermaid
    const savedTheme = localStorage.getItem('james-theme') || (document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    applyDocTheme(savedTheme !== 'light');

    // 6. Generate Table of Contents and Anchor Links
    const headings = renderContainer.querySelectorAll('h1, h2, h3, h4');
    const tocContainer = document.getElementById('tocContainer');
    document.getElementById('headingCount').textContent = headings.length;

    // Helper: Scroll ONLY the inner page content container, never the window or TOC
    function scrollToHeading(targetEl, smooth = true) {
      if (!targetEl) return;
      const scrollContainer = document.getElementById('contentScrollArea');
      if (!scrollContainer) return;
      const containerRect = scrollContainer.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();
      const relativeTop = targetRect.top - containerRect.top + scrollContainer.scrollTop;

      scrollContainer.scrollTo({
        top: Math.max(0, relativeTop - 24),
        behavior: smooth ? 'smooth' : 'auto'
      });
    }

    headings.forEach((heading, idx) => {
      const text = heading.textContent.trim();
      const slug = 'heading-' + idx + '-' + text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      heading.id = slug;

      const level = parseInt(heading.tagName.substring(1), 10);
      const indentClass = level === 1 ? 'font-bold text-slate-200' :
                          level === 2 ? 'pl-3 text-slate-300 font-medium' :
                          level === 3 ? 'pl-6 text-slate-400' : 'pl-9 text-slate-500';

      const tocItem = document.createElement('a');
      tocItem.href = '#' + slug;
      tocItem.className = `block py-1.5 px-2 rounded hover:bg-slate-800 transition truncate ${indentClass}`;
      tocItem.textContent = text;
      tocItem.onclick = (e) => {
        e.preventDefault();
        scrollToHeading(heading, true);
        highlightActiveToc(tocItem);
      };

      tocContainer.appendChild(tocItem);
    });

    function highlightActiveToc(activeItem) {
      tocContainer.querySelectorAll('a').forEach(a => {
        a.classList.remove('bg-indigo-950', 'text-indigo-300', 'font-semibold', 'bg-indigo-100', 'text-indigo-700');
      });
      if (activeItem) {
        const isDark = document.documentElement.classList.contains('dark');
        if (isDark) {
          activeItem.classList.add('bg-indigo-950', 'text-indigo-300', 'font-semibold');
        } else {
          activeItem.classList.add('bg-indigo-100', 'text-indigo-700', 'font-semibold');
        }
      }
    }

    // 6. Scroll page to target section if provided (and not the top H1 title)
    if (targetSection) {
      setTimeout(() => {
        const matchingHeading = Array.from(headings).find((h, idx) => {
          if (idx === 0) return false;
          const cleanText = h.textContent.toLowerCase().replace(/^[0-9\.\s]+/, '').trim();
          const cleanTarget = targetSection.toLowerCase().replace(/^[0-9\.\s]+/, '').trim();
          return h.textContent.toLowerCase().includes(targetSection.toLowerCase()) || 
                 (cleanTarget.length > 3 && cleanText.includes(cleanTarget));
        });
        if (matchingHeading) {
          scrollToHeading(matchingHeading, true);
          matchingHeading.classList.add('bg-indigo-950/70', 'p-2', 'rounded-lg', 'transition-colors', 'duration-500');
          setTimeout(() => {
            matchingHeading.classList.remove('bg-indigo-950/70');
          }, 3000);
          const headingIdx = Array.from(headings).indexOf(matchingHeading);
          const tocLinks = tocContainer.querySelectorAll('a');
          if (tocLinks[headingIdx]) {
            highlightActiveToc(tocLinks[headingIdx]);
          }
        } else {
          document.getElementById('contentScrollArea').scrollTop = 0;
        }
      }, 250);
    } else {
      document.getElementById('contentScrollArea').scrollTop = 0;
    }

    // 7. Copy Raw Markdown Action
    function copyRawMarkdown() {
      navigator.clipboard.writeText(rawContent).then(() => {
        const btn = document.getElementById('copyBtn');
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<span>✅</span><span class="hidden sm:inline">Copied!</span>';
        setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
      });
    }

    // 8. In-Document Search Filter
    const searchInput = document.getElementById('docSearchInput');
    const matchCountBadge = document.getElementById('searchMatchCount');

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        matchCountBadge.textContent = '';
        renderContainer.querySelectorAll('mark.doc-match').forEach(m => {
          m.replaceWith(...m.childNodes);
        });
        return;
      }
      
      let count = 0;
      // Search headings in TOC
      tocContainer.querySelectorAll('a').forEach(a => {
        const matches = a.textContent.toLowerCase().includes(term);
        a.style.display = matches ? 'block' : 'none';
        if (matches) count++;
      });
      matchCountBadge.textContent = count > 0 ? `${count} sec` : '0';
    });
  </script>
</body>
</html>
