<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • JAMES Building Aware Digital Twin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .bg-wallpaper {
      background-image: url('/static/jemby_building_aware_wallpaper.jpg?v=20261002_v2');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden bg-wallpaper">
  
  <div class="w-full max-w-md relative z-10">
    <!-- Clean Solid / Crisp Login Card -->
    <div class="bg-slate-900/95 border border-slate-700/80 rounded-3xl shadow-2xl p-8 sm:p-9 space-y-6 shadow-black/90">
      
      <!-- Brand Header with Logo / Lightning Icon -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 shadow-xl shadow-emerald-500/25 mb-1 ring-4 ring-emerald-500/20">
          <svg class="w-8 h-8 text-slate-950 fill-current" viewBox="0 0 24 24">
            <path d="M13 2L3 14h8l-1 8 11-12h-8l1-8z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center justify-center gap-2">
          <span>JEMBY</span>
          <span class="text-xs uppercase font-mono px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Building Aware</span>
        </h1>
        <p class="text-xs text-slate-300 font-medium">Electrical Infrastructure Digital Twin Platform</p>
      </div>

      <!-- Error Alert -->
      {% if error %}
      <div class="p-3.5 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-300 text-xs flex items-center gap-2.5 animate-shake">
        <svg class="w-4 h-4 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form action="/login" method="POST" class="space-y-4">
        <input type="hidden" name="next" value="{{ next_url | default('') }}">

        <div>
          <label for="username" class="block text-xs font-semibold text-slate-200 uppercase tracking-wider mb-1.5">Email or Username</label>
          <div class="relative">
            <input type="text" id="username" name="username" required autofocus placeholder="e.g., mcornelio@jemby.com"
                   class="w-full bg-slate-950/80 border border-slate-700 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none shadow-inner">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-200 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required placeholder="••••••••"
                   class="w-full bg-slate-950/80 border border-slate-700 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 transition outline-none shadow-inner">
          </div>
        </div>

        <button type="submit"
                class="w-full py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]">
          <span>Sign In to Workbench</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </form>

      <!-- Optional Google SSO (Visible only when OAuth credentials configured) -->
      {% if google_sso_configured %}
      <div class="relative flex items-center justify-center my-4">
        <div class="border-t border-slate-700/60 w-full"></div>
        <span class="bg-slate-900/90 px-3 text-[11px] uppercase tracking-wider text-slate-400 font-semibold">or</span>
        <div class="border-t border-slate-700/60 w-full"></div>
      </div>

      <div>
        <a href="/auth/google?next={{ next_url | urlencode }}" class="w-full py-2.5 px-4 bg-slate-800/90 hover:bg-slate-700 border border-slate-600 text-slate-100 font-medium text-sm rounded-xl transition flex items-center justify-center gap-3 shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Sign In with Google</span>
        </a>
      </div>
      {% endif %}

      <!-- Quick Team Logins Info with One-Click Fill -->
      <div class="p-3 bg-slate-950/60 border border-slate-800/80 rounded-2xl space-y-2 text-[11px] text-slate-300 font-mono backdrop-blur-md">
        <div class="text-slate-400 font-semibold uppercase tracking-wider text-[10px] flex items-center justify-between">
          <span>Team Quick Access:</span>
          <span class="text-[9px] text-slate-400 lowercase font-sans">click to fill</span>
        </div>
        <div class="grid grid-cols-2 gap-1.5 text-[11px]">
          <button type="button" onclick="fillCreds('mcornelio@jemby.com', 'mcornelio')" class="text-left px-2 py-1 rounded bg-slate-800/60 hover:bg-emerald-950/50 hover:border-emerald-500/40 border border-slate-700/50 text-emerald-400 hover:text-emerald-300 transition truncate cursor-pointer font-semibold">
            mcornelio
          </button>
          <button type="button" onclick="fillCreds('benjie@jemby.com', 'benjie')" class="text-left px-2 py-1 rounded bg-slate-800/60 hover:bg-emerald-950/50 hover:border-emerald-500/40 border border-slate-700/50 text-emerald-400 hover:text-emerald-300 transition truncate cursor-pointer font-semibold">
            benjie
          </button>
          <button type="button" onclick="fillCreds('stostado@jemby.com', 'stostado')" class="text-left px-2 py-1 rounded bg-slate-800/60 hover:bg-blue-950/50 hover:border-blue-500/40 border border-slate-700/50 text-blue-400 hover:text-blue-300 transition truncate cursor-pointer font-semibold">
            stostado
          </button>
          <button type="button" onclick="fillCreds('jcortes@jemby.com', 'jcortes')" class="text-left px-2 py-1 rounded bg-slate-800/60 hover:bg-blue-950/50 hover:border-blue-500/40 border border-slate-700/50 text-blue-400 hover:text-blue-300 transition truncate cursor-pointer font-semibold">
            jcortes
          </button>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="text-center mt-5 text-[11px] text-slate-300 font-mono drop-shadow-md">
      JEMBY Building Aware • Multi-Tenant SQLite Digital Twin
    </div>
  </div>

  <script>
    function fillCreds(username, password) {
      const u = document.getElementById('username');
      const p = document.getElementById('password');
      if (u) u.value = username;
      if (p) p.value = password;
      if (u) u.focus();
    }
  </script>

</body>
</html>
