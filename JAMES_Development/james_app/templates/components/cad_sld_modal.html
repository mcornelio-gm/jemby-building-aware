<!-- Building Aware (JAMES) - Interactive CAD Single-Line Diagram Modal -->
<div 
  x-show="showCadModal" 
  x-cloak
  class="fixed inset-0 overflow-hidden"
  style="z-index: 99998 !important;"
  aria-labelledby="cad-modal-title" 
  role="dialog" 
  aria-modal="true"
  @keydown.escape.window="if (showCadModal) closeCadSldModal()"
>
  <!-- Dark Backdrop -->
  <div 
    x-show="showCadModal"
    x-transition:enter="ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-slate-950/85 backdrop-blur-md transition-opacity"
    @click="closeCadSldModal()"
  ></div>

  <!-- Full-Screen Center Dialog Container -->
  <div class="fixed inset-2 sm:inset-4 md:inset-6 flex flex-col pointer-events-none z-10">
    <div 
      x-show="showCadModal"
      x-transition:enter="ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-98"
      x-transition:enter-end="opacity-100 scale-100"
      x-transition:leave="ease-in duration-150"
      x-transition:leave-start="opacity-100 scale-100"
      x-transition:leave-end="opacity-0 scale-98"
      class="relative flex flex-col w-full h-full bg-[#0B0F19] border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden pointer-events-auto text-slate-100"
    >
      <!-- CAD Modal Header Bar -->
      <div class="px-4 sm:px-6 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between gap-3 shrink-0 select-none">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 font-bold text-base shadow-xs">
            📐
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 id="cad-modal-title" class="text-sm sm:text-base font-extrabold text-white tracking-tight leading-none">
                AutoCAD Single-Line Diagram
              </h2>
              <span class="text-[9px] uppercase font-mono px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-bold">IEEE 315 / ANSI</span>
            </div>
            <p class="text-[11px] text-slate-400 mt-0.5">
              Deterministic orthogonal bus-and-feeder schematic for <strong class="text-slate-200" x-text="(client || 'facility').toUpperCase() + ' / ' + (facility || '').toUpperCase()"></strong>
            </p>
          </div>
        </div>

        <!-- Header Actions: Sheet Selector, Size Toggle, Theme Toggle, Zoom Stepper & Download DXF -->
        <div class="flex items-center gap-2 sm:gap-2.5">
          <!-- Drawing Sheet Selector Dropdown (Multi-Sheet Sets) -->
          <div class="flex items-center gap-1.5" x-show="cadSheets && cadSheets.length > 1">
            <span class="text-[11px] text-slate-400 font-mono hidden xl:inline">Sheet:</span>
            <select 
              x-model="selectedCadSheet" 
              @change="onCadSheetChange($event.target.value)"
              class="bg-slate-800 border border-slate-700 hover:border-slate-600 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 outline-none focus:ring-1 focus:ring-indigo-500 font-mono shadow-2xs transition cursor-pointer max-w-[200px] sm:max-w-[240px] truncate"
              title="Select Drawing Sheet"
            >
              <template x-for="s in cadSheets" :key="s.sheet_id">
                <option :value="s.sheet_id" x-text="(s.sheet_no ? s.sheet_no + ': ' : '') + s.title"></option>
              </template>
            </select>
          </div>

          <!-- Sheet Size Selector (36x24 vs 42x30) -->
          <div class="flex items-center rounded-lg border border-slate-700 bg-slate-800/90 shadow-2xs overflow-hidden text-xs">
            <button 
              type="button" 
              @click="setCadSheetSize('36x24')" 
              class="px-2.5 py-1 text-[11px] font-mono transition cursor-pointer"
              :class="cadSheetSize === '36x24' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-300 hover:text-white hover:bg-slate-700'"
              title="Standard ANSI D (36″ × 24″ / 864mm × 558mm)"
            >
              36×24
            </button>
            <button 
              type="button" 
              @click="setCadSheetSize('42x30')" 
              class="px-2.5 py-1 text-[11px] font-mono transition cursor-pointer border-l border-slate-700"
              :class="cadSheetSize === '42x30' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-300 hover:text-white hover:bg-slate-700'"
              title="Large ARCH E1 (42″ × 30″ / 1067mm × 762mm)"
            >
              42×30
            </button>
          </div>

          <!-- Label Format Selector (Linear vs Stacked) -->
          <div class="flex items-center rounded-lg border border-slate-700 bg-slate-800/90 shadow-2xs overflow-hidden text-xs">
            <button 
              type="button" 
              @click="setCadLabelFormat('linear')" 
              class="px-2 py-1 text-[11px] font-mono transition cursor-pointer flex items-center gap-1"
              :class="cadLabelFormat === 'linear' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-300 hover:text-white hover:bg-slate-700'"
              title="Linear equipment and bus annotations (single line)"
            >
              <span>═</span>
              <span class="hidden xl:inline">Linear</span>
            </button>
            <button 
              type="button" 
              @click="setCadLabelFormat('stacked')" 
              class="px-2 py-1 text-[11px] font-mono transition cursor-pointer border-l border-slate-700 flex items-center gap-1"
              :class="cadLabelFormat === 'stacked' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-300 hover:text-white hover:bg-slate-700'"
              title="Stacked multi-line equipment and bus annotations (compact footprint)"
            >
              <span>☰</span>
              <span class="hidden xl:inline">Stacked</span>
            </button>
          </div>

          <!-- Theme Toggle (Light / Dark Mode) -->
          <button 
            type="button" 
            @click="toggleCadTheme()" 
            class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition shadow-2xs flex items-center gap-1.5 cursor-pointer"
            :class="cadTheme === 'light' ? 'bg-amber-500/15 text-amber-300 border-amber-500/40 hover:bg-amber-500/25' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
            :title="cadTheme === 'light' ? 'Switch to Dark CAD Blueprint' : 'Switch to Light Architectural Print'"
          >
            <span x-text="cadTheme === 'light' ? '☀️' : '🌙'"></span>
            <span class="hidden md:inline text-[11px]" x-text="cadTheme === 'light' ? 'Light' : 'Dark'"></span>
          </button>

          <!-- High Contrast Toggle (Monochrome White/Black) -->
          <button 
            type="button" 
            @click="toggleCadHighContrast()" 
            class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition shadow-2xs flex items-center gap-1.5 cursor-pointer"
            :class="cadHighContrast ? 'bg-white text-slate-950 font-bold border-white ring-2 ring-indigo-400' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
            :title="cadHighContrast ? 'Disable High Contrast (restore AIA color palette)' : 'Enable High Contrast (pure white on black / black on white)'"
          >
            <span>☯</span>
            <span class="hidden lg:inline text-[11px]" x-text="cadHighContrast ? 'High Contrast: ON' : 'High Contrast'"></span>
          </button>

          <!-- Zoom Stepper Controls -->
          <div class="flex items-center rounded-lg border border-slate-700 bg-slate-800/90 shadow-2xs overflow-hidden text-xs">
            <button 
              type="button" 
              @click="zoomOutCad()" 
              class="w-7 h-7 text-slate-300 hover:text-white hover:bg-slate-700 font-bold transition flex items-center justify-center border-r border-slate-700 cursor-pointer"
              title="Zoom Out (-)"
            >
              −
            </button>
            <button 
              type="button" 
              @click="resetCadZoom()" 
              class="px-2 py-1 text-[11px] font-mono text-slate-300 hover:text-white hover:bg-slate-700 transition cursor-pointer min-w-[42px] text-center"
              title="Reset Zoom (100%)"
              x-text="Math.round(cadZoomScale * 100) + '%'"
            >
              100%
            </button>
            <button 
              type="button" 
              @click="zoomInCad()" 
              class="w-7 h-7 text-slate-300 hover:text-white hover:bg-slate-700 font-bold transition flex items-center justify-center border-l border-slate-700 cursor-pointer"
              title="Zoom In (+)"
            >
              +
            </button>
          </div>

          <!-- Re-Compile Button -->
          <button 
            type="button" 
            @click="fetchCadSvg()" 
            class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition shadow-2xs flex items-center gap-1.5 cursor-pointer"
            title="Re-compile from facility digital twin"
          >
            <span :class="{'animate-spin': cadLoading}">🔄</span>
            <span class="hidden lg:inline">Re-compile</span>
          </button>

          <!-- Download DXF Button (AutoCAD Native) -->
          <button 
            type="button" 
            @click="downloadCadDxf()" 
            class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-md shadow-emerald-950/40 transition flex items-center gap-1.5 cursor-pointer"
            title="Download AutoCAD R2018 DXF format"
          >
            <span>📥</span>
            <span>Download .DXF</span>
          </button>

          <div class="h-4 w-[1px] bg-slate-800 hidden sm:block"></div>

          <!-- Close Modal Button -->
          <button 
            type="button" 
            @click="closeCadSldModal()" 
            class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer"
            title="Close (Esc)"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Main CAD Drawing Viewport Canvas -->
      <div 
        class="relative flex-1 overflow-hidden flex items-center justify-center p-6 select-none cursor-grab active:cursor-grabbing transition-colors duration-200"
        :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-[#FFFFFF]' : 'bg-[#000000]') : (cadTheme === 'light' ? 'bg-[#E2E8F0]' : 'bg-[#070A12]')"
        :style="cadHighContrast ? '' : (cadTheme === 'light' ? 'background-image: radial-gradient(#94A3B8 1px, transparent 1px); background-size: 24px 24px;' : 'background-image: radial-gradient(#1E293B 1px, transparent 1px); background-size: 24px 24px;')"
        @mousedown="startCadPan($event)"
        @mousemove="doCadPan($event)"
        @mouseup="endCadPan()"
        @mouseleave="endCadPan()"
        @wheel.prevent="onCadWheel($event)"
      >
        <!-- Loading Overlay -->
        <div x-show="cadLoading" class="absolute inset-0 backdrop-blur-xs flex flex-col items-center justify-center gap-2 z-20" :class="cadTheme === 'light' ? 'bg-slate-200/80' : 'bg-slate-950/70'">
          <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-xs font-mono font-medium" :class="cadTheme === 'light' ? 'text-indigo-800' : 'text-indigo-300'">Generating IEEE CAD Geometry & Layer Vectors...</span>
        </div>

        <!-- SVG Container with dynamic Zoom & Pan Transform -->
        <div 
          class="transition-transform duration-75 origin-center flex items-center justify-center pointer-events-none rounded-xs"
          :class="cadTheme === 'light' ? 'shadow-2xl shadow-slate-500/50 border border-slate-300' : 'shadow-2xl shadow-black/80 border border-slate-800'"
          :style="`transform: translate(${cadPanX}px, ${cadPanY}px) scale(${cadZoomScale}); max-width: 95%; max-height: 90%;`"
          x-html="cadSvgContent"
        ></div>
      </div>

      <!-- Footer: AIA Layer Legend & Metadata -->
      <div class="px-4 sm:px-6 py-2 bg-slate-950/90 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-slate-400 shrink-0 select-none">
        <div class="flex items-center gap-3">
          <span class="font-bold text-slate-300 uppercase">AIA CAD Layers:</span>
          <!-- Dynamic colors based on active theme & high contrast -->
          <span class="flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full" :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-black border border-slate-400' : 'bg-white') : (cadTheme === 'light' ? 'bg-[#0284C7]' : 'bg-cyan-400')"></span> E-ELEC-BUS
          </span>
          <span class="flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full" :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-black border border-slate-400' : 'bg-white') : (cadTheme === 'light' ? 'bg-[#0F172A] border border-slate-500' : 'bg-white')"></span> E-ELEC-FEED
          </span>
          <span class="flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full" :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-black border border-slate-400' : 'bg-white') : (cadTheme === 'light' ? 'bg-[#D97706]' : 'bg-yellow-400')"></span> E-ELEC-SYMB
          </span>
          <span class="flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full" :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-black border border-slate-400' : 'bg-white') : (cadTheme === 'light' ? 'bg-[#15803D]' : 'bg-emerald-400')"></span> E-ANNO-TEXT
          </span>
          <span class="flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full" :class="cadHighContrast ? (cadTheme === 'light' ? 'bg-black border border-slate-400' : 'bg-white') : (cadTheme === 'light' ? 'bg-[#DC2626]' : 'bg-rose-400')"></span> E-ANNO-CABL
          </span>
        </div>
        <div class="text-[10px] text-slate-500 flex items-center gap-2">
          <span>Sheet: <strong class="text-slate-400" x-text="cadSheetSize === '42x30' ? 'ARCH E1 (30″ × 42″)' : 'ANSI D (24″ × 36″)'"></strong></span>
          <span>•</span>
          <span>Labels: <strong class="text-slate-400" x-text="cadLabelFormat === 'stacked' ? 'Stacked' : 'Linear'"></strong></span>
          <span>•</span>
          <span>Mode: <strong class="text-slate-400" x-text="cadHighContrast ? (cadTheme === 'light' ? 'High Contrast (Black on White)' : 'High Contrast (White on Black)') : (cadTheme === 'light' ? 'Architectural Print (Light)' : 'CAD Blueprint (Dark)')"></strong></span>
          <span>•</span>
          <span>AutoCAD R2018</span>
        </div>
      </div>
    </div>
  </div>
</div>
