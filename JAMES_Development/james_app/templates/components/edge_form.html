<div class="space-y-6">
    <div class="flex items-center justify-between border-b pb-3">
        <div>
            <h3 class="text-lg font-bold text-slate-800">Feeder / Connection</h3>
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">{{ edge.from_node }}:{{ edge.from_port }} → {{ edge.to_node }}:{{ edge.to_port }}</p>
        </div>
        <button type="button" onclick="resetInspector()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">&times;</button>
    </div>

    <form hx-post="/api/projects/{{ project_id }}/edges/{{ edge.id }}"
          hx-target="#form-container"
          hx-swap="innerHTML"
          class="space-y-4">

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Breaker / Protection Label</label>
            <input type="text" name="breaker" value="{{ edge.data.get('breaker', '') }}" placeholder="e.g. CB-MAIN-MSA (2000A)"
                   class="w-full text-sm border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Fuse Specification</label>
            <input type="text" name="fuse" value="{{ edge.data.get('fuse', '') }}" placeholder="e.g. 50E Fuse"
                   class="w-full text-sm border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Conductor / Cable Size & Qty</label>
            <input type="text" name="cable" value="{{ edge.data.get('cable', '') }}" placeholder="e.g. 2x (3-4/0 Cu)"
                   class="w-full text-sm border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">Run Length (ft)</label>
            <input type="number" step="any" name="length_ft" value="{{ edge.data.get('length_ft', '') }}" placeholder="50"
                   class="w-full text-sm border-slate-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 px-3 py-2 border">
        </div>

        <div class="pt-4 border-t flex space-x-2">
            <button type="submit"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow text-sm transition">
                Save Connection
            </button>
            <button type="button"
                    hx-delete="/api/projects/{{ project_id }}/edges/{{ edge.id }}"
                    hx-confirm="Delete this feeder connection?"
                    hx-target="#form-container"
                    class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-2 px-3 rounded-md text-sm transition">
                Delete
            </button>
        </div>
    </form>
</div>
