<!-- SHARED EQUIPMENT ARCHETYPE PICKER MODAL -->
<!-- Used across Survey Workbench and Single-Line Diagram (SLD) View -->
<div 
  x-show="showEquipmentPicker" 
  x-cloak
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  @keydown.escape.window="closeEquipmentPicker()"
>
  <!-- Modal Card -->
  <div 
    class="relative w-full max-w-4xl max-h-[90vh] bg-white dark:bg-[#0E1626] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden"
    @click.away="closeEquipmentPicker()"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95 translate-y-2"
    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100 translate-y-0"
    x-transition:leave-end="opacity-0 scale-95 translate-y-2"
  >
    <!-- Modal Header -->
    <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-[#0B1220]/80 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-500 text-white flex items-center justify-center font-bold text-base shadow-md shadow-indigo-500/20">
          ➕
        </div>
        <div>
          <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
            <span>Select Equipment Archetype</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-semibold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
              10 Domains
            </span>
          </h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Choose an electrical archetype to add a new digital twin device</p>
        </div>
      </div>

      <!-- Close Button -->
      <button 
        type="button" 
        @click="closeEquipmentPicker()" 
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition cursor-pointer"
        title="Close (Esc)"
      >
        ✕
      </button>
    </div>

    <!-- Search & Domain Filter Toolbar -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#0E1626] space-y-3 shrink-0">
      <!-- Search Input -->
      <div class="relative">
        <input 
          type="text" 
          x-model="pickerSearch"
          placeholder="Search archetypes by code, name, or domain (e.g. ATS, MDP, XFMR, UPS, Chiller, BESS, Feeder)..." 
          class="w-full h-10 pl-9 pr-9 text-xs rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-500 text-slate-900 dark:text-white font-medium"
          x-ref="pickerSearchInput"
        >
        <span class="absolute left-3 top-3 text-slate-400 text-xs">🔍</span>
        <button 
          type="button" 
          x-show="pickerSearch" 
          @click="pickerSearch = ''" 
          class="absolute right-3 top-2.5 w-5 h-5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-300 flex items-center justify-center text-[10px] hover:bg-slate-300 transition"
        >
          ✕
        </button>
      </div>

      <!-- 10 Domain Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-thin text-xs select-none">
        <button 
          type="button" 
          @click="pickerDomainFilter = 'all'"
          class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition cursor-pointer text-xs"
          :class="pickerDomainFilter === 'all' ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/30' : 'bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'"
        >
          All Domains
        </button>
        <template x-for="dom in domains" :key="dom.id">
          <button 
            type="button" 
            @click="pickerDomainFilter = dom.id"
            class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition flex items-center gap-1.5 cursor-pointer text-xs"
            :class="pickerDomainFilter === dom.id ? 'bg-indigo-600 text-white shadow-sm shadow-indigo-600/30' : 'bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'"
          >
            <span x-text="dom.icon"></span>
            <span x-text="dom.name"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Archetype Grid Content Area -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-5">
      <!-- Empty State -->
      <div x-show="filteredPickerItems.length === 0" class="py-12 text-center">
        <div class="text-3xl mb-2">🔍</div>
        <h4 class="text-sm font-bold text-slate-700 dark:text-slate-300">No matching electrical archetypes</h4>
        <p class="text-xs text-slate-400 mt-1">Try adjusting your search keywords or selecting "All Domains".</p>
        <button 
          type="button" 
          @click="pickerSearch = ''; pickerDomainFilter = 'all'"
          class="mt-3 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800"
        >
          Reset Filters
        </button>
      </div>

      <!-- Archetype Cards Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <template x-for="item in filteredPickerItems" :key="item.domainId + '_' + item.tag">
          <button 
            type="button"
            @click="onSelectArchetypeFromPicker(item)"
            class="group p-3 rounded-xl bg-slate-50 dark:bg-[#121B2E] hover:bg-white dark:hover:bg-[#1A2640] border border-slate-200 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500 shadow-xs hover:shadow-md transition text-left flex flex-col justify-between cursor-pointer"
          >
            <div>
              <!-- Top Row: Icon + Tag Badge + Domain Name -->
              <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="w-8 h-8 rounded-lg bg-indigo-600/10 dark:bg-indigo-400/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-mono font-bold text-xs border border-indigo-200 dark:border-indigo-900 group-hover:bg-indigo-600 group-hover:text-white transition" x-text="item.tag"></span>
                  <span class="text-[10px] font-mono font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center gap-1">
                    <span x-text="item.domainIcon"></span>
                    <span x-text="item.domainName"></span>
                  </span>
                </div>
                <template x-if="item.is_panel">
                  <span class="px-1.5 py-0.5 rounded text-[9px] font-bold font-mono bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800">
                    PANEL
                  </span>
                </template>
              </div>

              <!-- Name -->
              <h3 class="font-bold text-xs text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition" x-text="item.name"></h3>
              
              <!-- Description -->
              <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2 mt-1" x-text="item.desc"></p>
            </div>

            <!-- Bottom Specs Bar -->
            <div class="mt-3 pt-2.5 border-t border-slate-200/60 dark:border-slate-800/80 flex items-center justify-between text-[10px] font-mono text-slate-500 dark:text-slate-400">
              <span class="truncate" x-text="(item.volts || '') + ' • ' + (item.amps ? item.amps + 'A' : '')"></span>
              <span class="font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-0.5 group-hover:translate-x-0.5 transition">
                <span>Select</span>
                <span>→</span>
              </span>
            </div>
          </button>
        </template>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-5 py-3 border-t border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-[#0B1220]/80 flex items-center justify-between shrink-0 text-xs">
      <div class="text-slate-500 dark:text-slate-400">
        <span x-text="filteredPickerItems.length"></span> archetypes available
      </div>
      <button 
        type="button" 
        @click="closeEquipmentPicker()"
        class="px-3.5 py-1.5 rounded-lg font-semibold bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition cursor-pointer"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
